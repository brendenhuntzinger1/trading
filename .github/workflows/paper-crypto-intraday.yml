# Crypto intraday PAPER engine, one pass per run (processes every new 5-minute bar since the last run).
# All setups are REJECTED research strategies run only to exercise the live path; see EVIDENCE_BOARD.md.
name: paper-crypto-intraday
on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 minutes, off the hour (GitHub delays top-of-hour schedules)
  workflow_dispatch:
permissions:
  contents: write
  issues: write               # alerts, only if a destination is approved in config/alerts.toml
concurrency:
  group: paper-state            # shared by every paper workflow: state writes never interleave
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.lock
      - name: Restore paper state
        id: restore
        run: scripts/paper_state.sh restore
      - name: Run (PAPER, simulated fills)
        env:
          TRADELAB_MODE: paper
        run: python -m tradelab.intraday.live_crypto --once
      - name: Heartbeat
        run: python -m tradelab.ops.watchdog beat paper-crypto-intraday --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Save paper state
        # Keep fills recorded before a crash, but never save over the stored state when it was not restored first.
        if: always() && steps.restore.outcome == 'success'
        run: scripts/paper_state.sh save "crypto intraday $(date -u +%FT%TZ)"
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/paper_alert.sh open "failed:paper-crypto-intraday" "paper-crypto-intraday failed" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Clear failure alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/paper_alert.sh resolve "failed:paper-crypto-intraday" "Recovered: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
