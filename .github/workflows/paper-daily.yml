# Daily PAPER cycle for the daily strategies and benchmarks. Public data only; no credentials.
# GitHub may delay scheduled runs; the runner is idempotent per UTC day, so late or repeated runs are safe.
name: paper-daily
on:
  schedule:
    - cron: "17 0 * * *"        # 00:17 UTC, after the daily candle closes
    - cron: "17 6 * * *"        # catch-up if the first run was delayed or dropped
  workflow_dispatch:
permissions:
  contents: write
  issues: write               # alerts, only if a destination is approved in config/alerts.toml
concurrency:
  group: paper-state            # shared by every paper workflow: state writes never interleave
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.lock
      - name: Restore paper state
        id: restore
        run: scripts/paper_state.sh restore
      - name: Run (PAPER, simulated fills)
        env:
          TRADELAB_MODE: paper
        run: python -m pytest -q && python -m tradelab.service.daily --config config/paper.toml && python -m tradelab.dashboard.build
      - name: Heartbeat
        run: python -m tradelab.ops.watchdog beat paper-daily --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Save paper state
        # Keep fills recorded before a crash, but never save over the stored state when it was not restored first.
        if: always() && steps.restore.outcome == 'success'
        run: scripts/paper_state.sh save "daily cycle $(date -u +%FT%TZ)"
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/paper_alert.sh open "failed:paper-daily" "paper-daily failed" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Clear failure alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/paper_alert.sh resolve "failed:paper-daily" "Recovered: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
