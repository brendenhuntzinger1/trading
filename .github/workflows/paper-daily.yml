# Daily PAPER cycle for the daily strategies and benchmarks. Public data only; no credentials.
# GitHub may delay scheduled runs; the runner is idempotent per UTC day, so late or repeated runs are safe.
name: paper-daily
on:
  schedule:
    - cron: "17 0 * * *"        # 00:17 UTC, after the daily candle closes
    - cron: "17 6 * * *"        # catch-up if the first run was delayed or dropped
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-state            # shared by every paper workflow: state writes never interleave
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.lock
      - name: Restore paper state
        id: restore
        run: scripts/paper_state.sh restore
      - name: Run (PAPER, simulated fills)
        env:
          TRADELAB_MODE: paper
        run: python -m pytest -q && python -m tradelab.service.daily --config config/paper.toml && python -m tradelab.dashboard.build
      - name: Save paper state
        # Keep fills recorded before a crash, but never save over the stored state when it was not restored first.
        if: always() && steps.restore.outcome == 'success'
        run: scripts/paper_state.sh save "daily cycle $(date -u +%FT%TZ)"
